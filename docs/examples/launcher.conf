# config/launcher.conf - captain-specific settings for the one-command macOS
# Herdr+Pi launcher (bin/fm-install-launcher.sh, docs/launcher.md). Copy this
# into a local, gitignored config/launcher.conf and edit. One "key=value"
# field per non-empty, non-comment line. Every required field must be set
# explicitly; the installer refuses rather than guessing a model, reasoning
# level, executable, or quota provider on your behalf.

# Required. "<provider>/<model-id>", exactly as Pi's own model catalog names it
# (verify with: pi --offline --list-models).
# Anthropic models are refused because this launcher routes its model through Pi.
model=openai-codex/gpt-5.6-sol

# Required. One of low|medium|high|xhigh|max (Pi's accepted --thinking levels).
thinking=low

# Required. Either an absolute path to the pi executable (pinned, never
# resolved through PATH at run time), or the literal word PATH to resolve it
# through PATH at each run instead.
pi_bin=PATH

# Required. The quota-axi provider name backing the pinned model above (for
# example codex, claude, or anthropic - see quota-axi --help for the exact
# provider identifiers on your machine).
quota_provider=codex

# Optional, default 25. Refuses to start or recover the primary while any
# included account/weekly window is below this percent remaining. Never
# applies to attaching an already-live primary, which spends no quota.
quota_reserve_percent=25

# Optional, default "firstmate". The Herdr workspace label, matching
# Firstmate's own herdr adapter convention (docs/herdr-backend.md) so the
# launcher's primary lands beside, never inside, ordinary task tabs.
workspace_label=firstmate

# Optional, default "fm-primary". The Herdr tab label for the primary itself.
tab_label=fm-primary
